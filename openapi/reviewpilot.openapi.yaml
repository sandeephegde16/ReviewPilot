openapi: 3.1.0
info:
  title: ReviewPilot
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Return a simple health response for the API.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /orchestrator/run:
    post:
      tags:
      - orchestrator
      summary: Run Review Orchestrator Endpoint
      description: Run the conversation-loop orchestrator for one requested ReviewPilot
        operation.
      operationId: run_review_orchestrator_endpoint_orchestrator_run_post
      parameters:
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReviewOrchestratorRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReviewOrchestratorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/extract-concepts:
