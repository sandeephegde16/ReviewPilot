openapi: 3.1.0
info:
  title: ReviewPilot
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Return a simple health response for the API.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /sessions/{session_id}/extract-concepts:
    post:
      tags:
      - sessions
      summary: Extract Session Concepts
      description: Extract gradeable concepts for a session using normalized session
        evidence and persist them to session_content.concepts_json.
      operationId: extract_session_concepts_sessions__session_id__extract_concepts_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ExtractConceptsRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractConceptsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/extract-assignment-requirements:
    post:
      tags:
      - sessions
      summary: Extract Session Assignment Requirements
      description: Extract assignment requirements for a session from stored assignment
        evidence and persist them to assignment_requirement.assignment_requirements_json.
      operationId: extract_session_assignment_requirements_sessions__session_id__extract_assignment_requirements_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ExtractAssignmentRequirementsRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractAssignmentRequirementsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/concepts:
    get:
      tags:
      - sessions
      summary: Get Stored Session Concepts
      description: Return the stored concepts document persisted for one session.
      operationId: get_stored_session_concepts_sessions__session_id__concepts_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionConceptsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - sessions
      summary: Update Stored Session Concepts
      description: Replace the stored concepts document persisted for one session.
      operationId: update_stored_session_concepts_sessions__session_id__concepts_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionConceptsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionConceptsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/assignment-requirements:
    get:
      tags:
      - sessions
      summary: Get Stored Session Assignment Requirements
      description: Return the stored assignment requirements document for one session.
      operationId: get_stored_session_assignment_requirements_sessions__session_id__assignment_requirements_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAssignmentRequirementsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - sessions
      summary: Update Stored Session Assignment Requirements
      description: Replace the stored assignment requirements document for one session.
      operationId: update_stored_session_assignment_requirements_sessions__session_id__assignment_requirements_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionAssignmentRequirementsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAssignmentRequirementsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /grade/concepts:
    post:
      tags:
      - grading
      summary: Grade Submission Concepts
      description: Grade a student's project against requested concepts using
        collected project evidence and persist the concept scores payload to
        student_grades.concept_scores.
      operationId: grade_submission_concepts_grade_concepts_post
      parameters:
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeConceptsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeConceptsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /allsessions:
    get:
      tags:
      - sessions
      summary: Get All Sessions
      description: Return all stored session titles and topics.
      operationId: get_all_sessions_allsessions_get
      parameters:
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
                title: Response Get All Sessions Allsessions Get
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/submissions:
    get:
      tags:
      - submissions
      summary: Get Session Submissions
      description: Return all assignment submissions associated with a session.
      operationId: get_session_submissions_sessions__session_id__submissions_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSubmission'
                title: Response Get Session Submissions Sessions  Session Id  Submissions
                  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /students/{student_id}/submissions:
    get:
      tags:
      - submissions
      summary: Get Student Submissions
      description: Return all assignment submissions associated with a student.
      operationId: get_student_submissions_students__student_id__submissions_get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: X-Trace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Trace-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSubmission'
                title: Response Get Student Submissions Students  Student Id  Submissions
                  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
          description: Stable error code for the failure type.
        message:
          type: string
          title: Message
          description: Human-readable error message.
        trace_id:
          type: string
          title: Trace Id
          description: Trace identifier for correlating logs.
      type: object
      required:
      - code
      - message
      - trace_id
      title: ApiError
      description: Machine-readable error details for API failures.
    ApiErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      type: object
      required:
      - error
      title: ApiErrorResponse
      description: Top-level error response payload.
    ApiWarning:
      properties:
        code:
          type: string
          title: Code
          description: Stable warning code.
        message:
          type: string
          title: Message
          description: Human-readable warning message.
      type: object
      required:
      - code
      - message
      title: ApiWarning
      description: Machine-readable warning details for partial fallbacks.
    AssignmentRequirementExtractionResult:
      properties:
        assignment_requirement_id:
          type: string
          title: Assignment Requirement Id
          description: Unique identifier for the assignment requirement record.
        assignment_title:
          type: string
          title: Assignment Title
          description: Stored title for the assignment.
        requirements:
          items:
            $ref: '#/components/schemas/ExtractedAssignmentRequirement'
          type: array
          minItems: 1
          title: Requirements
          description: Extracted requirements for this assignment.
      type: object
      required:
      - assignment_requirement_id
      - assignment_title
      - requirements
      title: AssignmentRequirementExtractionResult
      description: Extracted requirements for one assignment row in the session.
    ExtractAssignmentRequirementsRequest:
      properties:
        reasoning_level:
          type: string
          enum:
          - low
          - medium
          - high
          title: Reasoning Level
          description: Requested reasoning depth for assignment requirement extraction.
          default: medium
      type: object
      title: ExtractAssignmentRequirementsRequest
      description: Public request payload for assignment requirement extraction.
    ExtractAssignmentRequirementsResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        assignment_requirements:
          items:
            $ref: '#/components/schemas/AssignmentRequirementExtractionResult'
          type: array
          title: Assignment Requirements
          description: Assignment requirements extracted from stored assignment evidence.
        warnings:
          items:
            $ref: '#/components/schemas/ApiWarning'
          type: array
          title: Warnings
          description: Warnings describing any fallback behavior during extraction.
      type: object
      required:
      - session_id
      - assignment_requirements
      title: ExtractAssignmentRequirementsResponse
      description: Public response payload for extracted session assignment requirements.
    ExtractConceptsRequest:
      properties:
        reasoning_level:
          type: string
          enum:
          - low
          - medium
          - high
          title: Reasoning Level
          description: Requested reasoning depth for concept extraction.
          default: medium
      type: object
      title: ExtractConceptsRequest
      description: Public request payload for gradeable concept extraction.
    ExtractConceptsResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        concepts:
          items:
            $ref: '#/components/schemas/GradeableConcept'
          type: array
          minItems: 1
          title: Concepts
          description: Gradeable concepts extracted from the session.
        warnings:
          items:
            $ref: '#/components/schemas/ApiWarning'
          type: array
          title: Warnings
          description: Warnings describing any fallback behavior during extraction.
      type: object
      required:
      - session_id
      - concepts
      title: ExtractConceptsResponse
      description: Public response payload for extracted gradeable concepts.
    SessionConceptsResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        concepts:
          items:
            $ref: '#/components/schemas/GradeableConcept'
          type: array
          title: Concepts
          description: Stored gradeable concepts currently persisted for the session.
      type: object
      required:
      - session_id
      - concepts
      title: SessionConceptsResponse
      description: Public response payload for the stored session concepts document.
    UpdateSessionConceptsRequest:
      properties:
        concepts:
          items:
            $ref: '#/components/schemas/GradeableConcept'
          type: array
          title: Concepts
          description: Stored gradeable concepts that should replace the session document.
      type: object
      title: UpdateSessionConceptsRequest
      description: Public request payload for replacing the stored session concepts
        document.
    ExtractedAssignmentRequirement:
      properties:
        requirement_type:
          type: string
          enum:
          - mandatory_deliverable
          - forbidden_project_type
          - scoring_criterion
          - evidence_expectation
          title: Requirement Type
          description: Canonical category for the extracted assignment requirement.
        title:
          type: string
          title: Title
          description: Short label for the extracted assignment requirement.
        summary:
          type: string
          title: Summary
          description: Brief explanation of the requirement.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Assignment title or description evidence supporting the requirement.
      type: object
      required:
      - requirement_type
      - title
      - summary
      - evidence
      title: ExtractedAssignmentRequirement
      description: One evidence-backed assignment requirement extracted from assignment
        text.
    StoredAssignmentRequirementResult:
      properties:
        assignment_requirement_id:
          type: string
          title: Assignment Requirement Id
          description: Unique identifier for the assignment requirement record.
        assignment_title:
          type: string
          title: Assignment Title
          description: Stored title for the assignment.
        assignment_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignment Description
          description: Stored assignment description shown in the assignments workspace.
        due_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Due At
          description: Stored due date for the assignment requirement, when available.
        required_deliverables:
          items:
            type: string
          type: array
          title: Required Deliverables
          description: Stored deliverables associated with the assignment requirement.
        requirements:
          items:
            $ref: '#/components/schemas/ExtractedAssignmentRequirement'
          type: array
          title: Requirements
          description: Stored requirements currently persisted for this assignment.
      type: object
      required:
      - assignment_requirement_id
      - assignment_title
      title: StoredAssignmentRequirementResult
      description: Stored requirements for one assignment row in the session.
    SessionAssignmentRequirementsResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        assignment_requirements:
          items:
            $ref: '#/components/schemas/StoredAssignmentRequirementResult'
          type: array
          title: Assignment Requirements
          description: Stored assignment requirements currently persisted for the session.
      type: object
      required:
      - session_id
      title: SessionAssignmentRequirementsResponse
      description: Public response payload for stored session assignment requirements.
    UpdateSessionAssignmentRequirementsRequest:
      properties:
        assignment_requirements:
          items:
            $ref: '#/components/schemas/StoredAssignmentRequirementResult'
          type: array
          title: Assignment Requirements
          description: Stored assignment requirements that should replace the session
            document.
      type: object
      title: UpdateSessionAssignmentRequirementsRequest
      description: Public request payload for replacing stored assignment requirements.
    ConceptGradingCriterion:
      properties:
        concept_name:
          type: string
          title: Concept Name
          description: Concept label that must be graded.
        summary:
          type: string
          title: Summary
          description: Short explanation of what the concept covers.
        grading_reason:
          type: string
          title: Grading Reason
          description: Why this concept matters for grading.
        max_score:
          type: integer
          minimum: 1.0
          title: Max Score
          description: Maximum number of points available for this concept.
      type: object
      required:
      - concept_name
      - summary
      - grading_reason
      - max_score
      title: ConceptGradingCriterion
      description: One requested concept and its grading weight for project scoring.
    ConceptScoreResult:
      properties:
        concept:
          type: string
          title: Concept
          description: Concept label that was graded.
        score:
          type: integer
          minimum: 0.0
          title: Score
          description: Awarded score for the concept.
        max_score:
          type: integer
          minimum: 1.0
          title: Max Score
          description: Maximum number of points available for the concept.
        coverage_level:
          type: string
          enum:
          - missing
          - weak
          - partial
          - strong
          title: Coverage Level
          description: Strength of concept coverage observed in the project evidence.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Concrete project evidence supporting the awarded score.
        deductions:
          items:
            type: string
          type: array
          title: Deductions
          description: Reasons points were not awarded in full.
      type: object
      required:
      - concept
      - score
      - max_score
      - coverage_level
      - evidence
      title: ConceptScoreResult
      description: One evidence-backed score awarded to a requested grading concept.
    GradeableConcept:
      properties:
        name:
          type: string
          title: Name
          description: Short concept label.
        summary:
          type: string
          title: Summary
          description: Brief explanation of the concept.
        grading_reason:
          type: string
          title: Grading Reason
          description: Why this concept is relevant for grading.
        concept_importance:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Concept Importance
          description: Importance score from 1 to 10 based on how central the concept
            is to the session.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Session evidence used to justify the concept.
      type: object
      required:
      - name
      - summary
      - grading_reason
      - concept_importance
      - evidence
      title: GradeableConcept
      description: Public response model for one extracted gradeable concept.
    GradeConceptsRequest:
      properties:
        student_id:
          type: string
          title: Student Id
          description: Unique identifier for the student being graded.
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the related session.
        source_type:
          type: string
          enum:
          - github_pr
          - local_folder
          - zip_upload
          title: Source Type
          description: Submission source type used to collect project evidence.
        repo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Url
          description: Repository or pull request URL when the source type is github_pr.
        local_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Local Path
          description: Local folder path when the source type is local_folder.
        zip_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Zip Path
          description: Zip archive path when the source type is zip_upload.
        reasoning_level:
          type: string
          enum:
          - low
          - medium
          - high
          title: Reasoning Level
          description: Requested reasoning depth for concept grading.
          default: medium
        concepts:
          items:
            $ref: '#/components/schemas/ConceptGradingCriterion'
          type: array
          minItems: 1
          title: Concepts
          description: Concepts that must be scored against the project evidence.
      type: object
      required:
      - student_id
      - session_id
      - source_type
      - concepts
      title: GradeConceptsRequest
      description: Public request payload for project concept grading.
    GradeConceptsResponse:
      properties:
        student_id:
          type: string
          title: Student Id
          description: Unique identifier for the student.
        student_code:
          type: string
          title: Student Code
          description: Stable course-visible identifier for the student.
        student_full_name:
          type: string
          title: Student Full Name
          description: Full name of the student.
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        source_type:
          type: string
          enum:
          - github_pr
          - local_folder
          - zip_upload
          title: Source Type
          description: Submission source type.
        repo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Url
          description: Repository or pull request URL when the source type is github_pr.
        local_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Local Path
          description: Local folder path when the source type is local_folder.
        zip_path:
          anyOf:
          - type: string
