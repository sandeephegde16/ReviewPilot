          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ExtractConceptsRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractConceptsResponse'
        '404':
