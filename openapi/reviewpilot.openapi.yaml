components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
          description: Stable error code for the failure type.
        message:
          type: string
          title: Message
          description: Human-readable error message.
        trace_id:
          type: string
          title: Trace Id
          description: Trace identifier for correlating logs.
      type: object
      required:
      - code
      - message
      - trace_id
      title: ApiError
      description: Machine-readable error details for API failures.
    ApiErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      type: object
      required:
      - error
      title: ApiErrorResponse
      description: Top-level error response payload.
    ApiWarning:
      properties:
        code:
          type: string
          title: Code
          description: Stable warning code.
        message:
          type: string
          title: Message
          description: Human-readable warning message.
      type: object
      required:
      - code
      - message
      title: ApiWarning
      description: Machine-readable warning details for partial fallbacks.
    AssignmentRequirementExtractionResult:
      properties:
        assignment_requirement_id:
          type: string
          title: Assignment Requirement Id
          description: Unique identifier for the assignment requirement record.
        assignment_title:
          type: string
          title: Assignment Title
          description: Stored title for the assignment.
        requirements:
          items:
            $ref: '#/components/schemas/ExtractedAssignmentRequirement'
          type: array
          minItems: 1
          title: Requirements
          description: Extracted requirements for this assignment.
      type: object
      required:
      - assignment_requirement_id
      - assignment_title
      - requirements
      title: AssignmentRequirementExtractionResult
      description: Extracted requirements for one assignment row in the session.
    AssignmentRequirementGradingCriterion:
      properties:
        requirement_type:
          type: string
          enum:
          - mandatory_deliverable
          - forbidden_project_type
          - scoring_criterion
          - evidence_expectation
          title: Requirement Type
          description: Canonical category for the requested assignment requirement.
        title:
          type: string
          title: Title
          description: Short assignment-requirement label that must be graded.
        summary:
          type: string
          title: Summary
          description: Brief explanation of what the requirement covers.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Stored assignment evidence that justifies grading this requirement.
        max_score:
          type: integer
          minimum: 1.0
          title: Max Score
          description: Maximum number of points available for this assignment requirement.
      type: object
      required:
      - requirement_type
      - title
      - summary
      - evidence
      - max_score
      title: AssignmentRequirementGradingCriterion
      description: One requested assignment requirement and its grading weight for
        project scoring.
    AssignmentRequirementScoreResult:
      properties:
        requirement_title:
          type: string
          title: Requirement Title
          description: Assignment requirement label that was graded.
        requirement_type:
          type: string
          enum:
          - mandatory_deliverable
          - forbidden_project_type
          - scoring_criterion
          - evidence_expectation
          title: Requirement Type
          description: Canonical category for the graded assignment requirement.
        score:
          type: integer
          minimum: 25.0
          title: Score
          description: Awarded score for the assignment requirement, normalized to
            a multiple of five between 25 and max_score.
        max_score:
          type: integer
          minimum: 1.0
          title: Max Score
          description: Maximum number of points available for the assignment requirement.
        coverage_level:
          type: string
          enum:
          - missing
          - weak
          - partial
          - strong
          title: Coverage Level
          description: Strength of requirement coverage observed in the project evidence.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Concrete project evidence supporting the awarded score.
        deductions:
          items:
            type: string
          type: array
          title: Deductions
          description: Reasons points were not awarded in full.
      type: object
      required:
      - requirement_title
      - requirement_type
      - score
      - max_score
      - coverage_level
      - evidence
      title: AssignmentRequirementScoreResult
      description: One evidence-backed score awarded to a requested assignment requirement.
    ConceptGradingCriterion:
      properties:
        concept_name:
          type: string
          title: Concept Name
          description: Concept label that must be graded.
        summary:
          type: string
          title: Summary
          description: Short explanation of what the concept covers.
        grading_reason:
          type: string
          title: Grading Reason
          description: Why this concept matters for grading.
        max_score:
          type: integer
          minimum: 1.0
          title: Max Score
          description: Maximum number of points available for this concept.
      type: object
      required:
      - concept_name
      - summary
      - grading_reason
      - max_score
      title: ConceptGradingCriterion
      description: One requested concept and its grading weight for project scoring.
    ConceptScoreResult:
      properties:
        concept:
          type: string
          title: Concept
          description: Concept label that was graded.
        score:
          type: integer
          minimum: 25.0
          title: Score
          description: Awarded score for the concept, normalized to a multiple of
            five between 25 and max_score.
        max_score:
          type: integer
          minimum: 1.0
          title: Max Score
          description: Maximum number of points available for the concept.
        coverage_level:
          type: string
          enum:
          - missing
          - weak
          - partial
          - strong
          title: Coverage Level
          description: Strength of concept coverage observed in the project evidence.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Concrete project evidence supporting the awarded score.
        deductions:
          items:
            type: string
          type: array
          title: Deductions
          description: Reasons points were not awarded in full.
      type: object
      required:
      - concept
      - score
      - max_score
      - coverage_level
      - evidence
      title: ConceptScoreResult
      description: One evidence-backed score awarded to a requested grading concept.
    ExtractAssignmentRequirementsRequest:
      properties:
        reasoning_level:
          type: string
          enum:
          - low
          - medium
          - high
          title: Reasoning Level
          description: Requested reasoning depth for assignment requirement extraction.
          default: medium
      type: object
      title: ExtractAssignmentRequirementsRequest
      description: Public request payload for assignment requirement extraction.
    ExtractAssignmentRequirementsResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        assignment_requirements:
          items:
            $ref: '#/components/schemas/AssignmentRequirementExtractionResult'
          type: array
          title: Assignment Requirements
          description: Assignment requirements extracted from stored assignment evidence.
        warnings:
          items:
            $ref: '#/components/schemas/ApiWarning'
          type: array
          title: Warnings
          description: Warnings describing any fallback behavior during extraction.
      type: object
      required:
      - session_id
      - assignment_requirements
      title: ExtractAssignmentRequirementsResponse
      description: Public response payload for extracted session assignment requirements.
    ExtractConceptsRequest:
      properties:
        reasoning_level:
          type: string
          enum:
          - low
          - medium
          - high
          title: Reasoning Level
          description: Requested reasoning depth for concept extraction.
          default: medium
      type: object
      title: ExtractConceptsRequest
      description: Public request payload for gradeable concept extraction.
    ExtractConceptsResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Unique identifier for the session.
        concepts:
          items:
            $ref: '#/components/schemas/GradeableConcept'
          type: array
          minItems: 1
          title: Concepts
          description: Gradeable concepts extracted from the session.
        warnings:
          items:
            $ref: '#/components/schemas/ApiWarning'
          type: array
          title: Warnings
          description: Warnings describing any fallback behavior during extraction.
      type: object
      required:
      - session_id
      - concepts
      title: ExtractConceptsResponse
      description: Public response payload for extracted gradeable concepts.
    ExtractedAssignmentRequirement:
      properties:
        requirement_type:
          type: string
          enum:
          - mandatory_deliverable
          - forbidden_project_type
          - scoring_criterion
          - evidence_expectation
          title: Requirement Type
          description: Canonical category for the extracted assignment requirement.
        title:
          type: string
          title: Title
          description: Short label for the extracted assignment requirement.
        summary:
          type: string
          title: Summary
          description: Brief explanation of the requirement.
        evidence:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence
          description: Assignment title or description evidence supporting the requirement.
      type: object
      required:
      - requirement_type
      - title
      - summary
      - evidence
      title: ExtractedAssignmentRequirement
      description: One evidence-backed assignment requirement extracted from assignment
        text.
    GradeAssignmentRequirementsRequest:
      properties:
        student_id:
          type: string
          title: Student Id
          description: Unique identifier for the student being graded.
        session_id:
          type: string
          title: Session Id
