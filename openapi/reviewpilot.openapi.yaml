          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSubmission'
                title: Response Get Student Submissions Students  Student Id  Submissions
                  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error
        '422':
